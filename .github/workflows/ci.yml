name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tasks-api:
    name: Tasks API (Node.js)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/tasks-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/tasks-api/package-lock.json
      - run: npm ci
      - run: npm test

  analytics-api:
    name: Analytics API (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/analytics-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend build (React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [tasks-api, analytics-api, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
