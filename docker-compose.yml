name: tasklane

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasklane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasklane}
      POSTGRES_DB: ${POSTGRES_DB:-tasklane}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  tasks-api:
    build: ./services/tasks-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tasklane}:${POSTGRES_PASSWORD:-tasklane}@db:5432/${POSTGRES_DB:-tasklane}
    depends_on:
      db:
        condition: service_healthy

  analytics-api:
    build: ./services/analytics-api
    restart: unless-stopped
    environment:
      TASKS_API_URL: http://tasks-api:3000
    depends_on:
      tasks-api:
        condition: service_healthy

  frontend:
    build: ./services/frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      tasks-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy

volumes:
  db-data:
